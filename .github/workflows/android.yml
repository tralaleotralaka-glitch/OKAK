name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Нативный VPN (основной релиз) ─────────────────────────────
  vpn:
    name: Сборка Obxod (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Сборка APK (vpn/)
        working-directory: vpn
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить содержимое APK
        id: vpnapk
        working-directory: vpn
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          for entry in AndroidManifest.xml classes.dex resources.arsc res/layout/activity_main.xml; do
            if unzip -l "$APK" | grep -q "$entry"; then
              echo "ok   $entry"
            else
              echo "::error::в APK отсутствует $entry"
              exit 1
            fi
          done
          unzip -l "$APK" | grep -q "app/okakvpn" || true
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$(grep -o "versionName '[^']*'" app/build.gradle | cut -d"'" -f2)
          NAME="OBXOD-${VERSION}-debug.apk"
          cp "$APK" "$NAME"
          {
            echo "file=$NAME"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Obxod APK собран: $NAME, $SIZE байт, sha256 $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: OBXOD-debug-apk
          path: vpn/${{ steps.vpnapk.outputs.file }}

      - name: Опубликовать VPN APK (основной релиз)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "vpn/${{ steps.vpnapk.outputs.file }}" \
            --title "Obxod — ${GITHUB_REF_NAME}" \
            --notes "Нативный Android VPN (VpnService) с большой кнопкой включения.

            - файл: ${{ steps.vpnapk.outputs.file }}
            - размер: ${{ steps.vpnapk.outputs.size }} байт
            - sha256: \`${{ steps.vpnapk.outputs.sha256 }}\`

            Огромная кнопка включения, настройки со сменой темы и список DNS
            (Cloudflare/Google/Quad9/AdGuard/Яндекс и др.) — DNS применяется в туннеле.
            Это каркас: VPN-интерфейс поднимается, но внешнего сервера нет, поэтому
            обход IP-блокировок не происходит (FORWARD_ALL=false). План — в vpn/README.md.
            Подпись отладочная: разрешите «Установку из неизвестных источников»." \
            --target "${GITHUB_SHA}"

  # ── ProxyTG (Capacitor, отдельный тег) ────────────────────────
  proxytg:
    name: Сборка ProxyTG (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Зависимости
        run: npm ci

      - name: Тесты веб-части
        run: npm test

      - name: Веб-ассеты в www/ и синхронизация Android-проекта
        run: npm run sync:android

      - name: Сборка APK (gradlew assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить содержимое APK
        id: apk
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          for entry in AndroidManifest.xml classes.dex resources.arsc \
                       assets/capacitor.config.json \
                       assets/public/index.html \
                       assets/public/css/styles.css \
                       assets/public/js/app.js \
                       assets/public/js/core.js \
                       assets/public/js/store.js \
                       assets/public/vendor/qrcode.js; do
            if unzip -l "$APK" | grep -q "$entry"; then
              echo "ok   $entry"
            else
              echo "::error::в APK отсутствует $entry"
              exit 1
            fi
          done
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$(node -p "require('./package.json').version")
          NAME="ProxyTG-${VERSION}-debug.apk"
          cp "$APK" "$NAME"
          {
            echo "file=$NAME"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::ProxyTG APK собран: $NAME, $SIZE байт, sha256 $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTG-debug-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Опубликовать ProxyTG APK (свой тег)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-proxytg-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.file }}" \
            --title "ProxyTG APK — ${GITHUB_REF_NAME}" \
            --notes "Генератор MTProto-прокси с белыми списками (web на Capacitor).

            - файл: ${{ steps.apk.outputs.file }}
            - размер: ${{ steps.apk.outputs.size }} байт
            - sha256: \`${{ steps.apk.outputs.sha256 }}\`" \
            --target "${GITHUB_SHA}"
