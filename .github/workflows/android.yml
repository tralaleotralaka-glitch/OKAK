name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Зависимости
        run: npm ci

      - name: Тесты веб-части
        run: npm test

      - name: Веб-ассеты в www/ и синхронизация Android-проекта
        run: npm run sync:android

      - name: Сборка APK (gradlew assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить содержимое APK
        id: apk
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          for entry in AndroidManifest.xml classes.dex resources.arsc \
                       assets/capacitor.config.json \
                       assets/public/index.html \
                       assets/public/css/styles.css \
                       assets/public/js/app.js \
                       assets/public/js/core.js \
                       assets/public/js/store.js \
                       assets/public/vendor/qrcode.js; do
            if unzip -l "$APK" | grep -q "$entry"; then
              echo "ok   $entry"
            else
              echo "::error::в APK отсутствует $entry"
              exit 1
            fi
          done
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          VERSION=$(node -p "require('./package.json').version")
          NAME="ProxyTG-${VERSION}-debug.apk"
          cp "$APK" "$NAME"
          {
            echo "file=$NAME"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::APK собран: $NAME, $SIZE байт, sha256 $SHA"
          unzip -l "$APK" | tail -2

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTG-debug-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Опубликовать APK в релизе
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            "${{ steps.apk.outputs.file }}" \
            --title "ProxyTG APK — ${GITHUB_REF_NAME}" \
            --notes "Собрано автоматически из ${GITHUB_SHA}.

            - файл: ${{ steps.apk.outputs.file }}
            - размер: ${{ steps.apk.outputs.size }} байт
            - sha256: \`${{ steps.apk.outputs.sha256 }}\`

            Внутри — веб-приложение ProxyTG (генератор MTProto-прокси и белые списки).
            Подпись отладочная (debug keystore), при установке Android попросит
            разрешить «Установку из неизвестных источников». Конфигурации прокси
            хранятся в localStorage приложения и не покидают телефон." \
            --target "${GITHUB_SHA}"
