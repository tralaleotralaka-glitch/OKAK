name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MySENGER.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MySENGER-apk
          path: MySENGER.apk

      # На ветке main APK также публикуется в разделе Releases (тег "latest")
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MySENGER (последняя сборка)
          prerelease: false
          make_latest: true
          files: MySENGER.apk
