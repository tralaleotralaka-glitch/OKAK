name: Build ARMv7 Android APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build tools
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'cmake;3.22.1' 'ndk;27.2.12479018'

      - name: Build ARMv7 debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: armv7-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK download on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/822837e6-okak'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="armv7-build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "ARMv7 APK build ${GITHUB_RUN_NUMBER}" \
              --notes "Debug APK for ARMv7 (armeabi-v7a), built from ${GITHUB_SHA}." \
              --prerelease
          fi
          gh release upload "$tag" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
