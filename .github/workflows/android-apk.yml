name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info > build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 80 build.log
            grep -E 'FAILURE:|What went wrong|^> |^e: |error:|Execution failed|Could not .*' build.log | tail -n 20 > build-error-summary.txt || true
            python3 - <<'PY'
          from pathlib import Path
          text = Path('build-error-summary.txt').read_text(errors='replace')
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Gradle build failure::{text}')
          PY
            exit "$result"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dns-compass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
