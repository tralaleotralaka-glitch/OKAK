plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.armv7starter'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.example.armv7starter'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-23'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
